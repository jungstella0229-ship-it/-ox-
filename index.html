<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국어 OX 퀴즈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .hidden {
            display: none;
        }

        .welcome-box {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-text {
            font-size: 20px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 30px;
        }

        .text-list {
            display: grid;
            gap: 15px;
        }

        .text-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .text-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .text-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .quiz-info {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
        }

        .current-text {
            font-size: 20px;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-number {
            font-size: 16px;
            color: #999;
        }

        .question-box {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: center;
        }

        .question-text {
            font-size: 20px;
            color: #333;
            line-height: 1.6;
        }

        .answer-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }

        .ox-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .o-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .x-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .ox-button:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .ox-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback {
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: center;
            font-size: 18px;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .explanation {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0,0,0,0.1);
            font-size: 16px;
            line-height: 1.6;
        }

        .next-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            display: block;
            margin: 20px auto;
            transition: transform 0.2s;
        }

        .next-button:hover {
            transform: scale(1.05);
        }

        .result-box {
            text-align: center;
        }

        .score {
            font-size: 48px;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
        }

        .quote {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-style: italic;
            color: #666;
            line-height: 1.6;
        }

        .concepts {
            background: #fff3cd;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: left;
        }

        .concepts h3 {
            color: #856404;
            margin-bottom: 15px;
        }

        .concepts ul {
            list-style-position: inside;
            color: #856404;
        }

        .concepts li {
            margin: 8px 0;
        }

        .restart-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .restart-button:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 24px;
            }
            .text-button {
                font-size: 16px;
                padding: 15px;
            }
            .ox-button {
                width: 80px;
                height: 80px;
                font-size: 32px;
            }
            .question-text {
                font-size: 18px;
            }
        }
    </style>
</head>

        <h1>📚 국어 OX 퀴즈</h1>

            <div id="feedback" class="hidden"></div>

        <div id="resultScreen" class="hidden">

            ],
            '구운몽': [
                "몽자류 소설의 특징",
                "액자식 구성",
                "인생무상과 불교 사상",
                "유불도 삼교의 조화"
            ],
            '강도몽유록': [
                "몽유록계 소설의 특징",

                "민족의식과 자주정신",
                "역사 인물의 평가와 비판"
            ]
        };

        window.onload = function() {
            document.getElementById('startButton').onclick = startQuiz;
            document.getElementById('oButton').onclick = function() { checkAnswer(true); };
            document.getElementById('xButton').onclick = function() { checkAnswer(false); };
            document.getElementById('restartButton').onclick = restart;
            createTextButtons();
        };

        function createTextButtons() {
            var textList = document.getElementById('textList');
            
            for (var i = 0; i < textNames.length; i++) {
                var textName = textNames[i];
                var button = document.createElement('button');
                button.className = 'text-button';
                button.textContent = textName;
                button.onclick = (function(name) {
                    return function() { selectText(name); };
                })(textName);
                textList.appendChild(button);
            }
        }

        function startQuiz() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('textSelection').classList.remove('hidden');
        }

        function selectText(textName) {
            currentTextName = textName;
            
            // 로딩 화면 표시
            document.getElementById('textSelection').classList.add('hidden');
            document.getElementById('loadingScreen').classList.remove('hidden');
            
            // 문제 생성
            setTimeout(function() {
                generateQuestions(textName);
            }, 800);
        }

        function generateQuestions(textName) {
            try {
                var allQuestions = questionBank[textName];
                
                // 랜덤하게 5개 선택
                var shuffled = allQuestions.slice();
                for (var i = shuffled.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = shuffled[i];
                    shuffled[i] = shuffled[j];
                    shuffled[j] = temp;
                }
                
                currentQuestions = shuffled.slice(0, 5);
                currentQuestionIndex = 0;
                firstAttemptCorrect = 0;
                wrongQuestions = [];
                isRetryMode = false;

                // 퀴즈 시작
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('quizScreen').classList.remove('hidden');
                showQuestion();

            } catch (error) {
                console.error('오류:', error);
                alert('문제 생성에 실패했습니다. 다시 시도해주세요.');
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('textSelection').classList.remove('hidden');
            }
        }

        function showQuestion() {
            var question = currentQuestions[currentQuestionIndex];
            
            document.getElementById('currentText').textContent = currentTextName;
            
            if (isRetryMode) {
                document.getElementById('questionNumber').textContent = '오답 체크 - ' + (currentQuestionIndex + 1) + '번째 문제';
            } else {
                document.getElementById('questionNumber').textContent = '문제 ' + (currentQuestionIndex + 1) + ' / 5';
            }
            
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('oButton').disabled = false;
            document.getElementById('xButton').disabled = false;
            document.getElementById('answerButtons').classList.remove('hidden');
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('feedback').innerHTML = '';
        }

        function checkAnswer(userAnswer) {
            var question = currentQuestions[currentQuestionIndex];
            var isCorrect = userAnswer === question.answer;

            document.getElementById('oButton').disabled = true;
            document.getElementById('xButton').disabled = true;

            var feedback = document.getElementById('feedback');
            feedback.classList.remove('hidden', 'correct', 'incorrect');
            
            if (isCorrect) {
                feedback.classList.add('correct');
                feedback.innerHTML = '<strong>✅ 정답입니다!</strong>';
                if (!isRetryMode) {
                    firstAttemptCorrect++;
                }
            } else {
                feedback.classList.add('incorrect');
                feedback.innerHTML = '<strong>❌ 오답입니다!</strong><div class="explanation">' + question.explanation + '</div>';
                if (!isRetryMode) {
                    wrongQuestions.push(question);
                }
            }

            var nextButton = document.createElement('button');
            nextButton.className = 'next-button';
            nextButton.textContent = '다음 문제';
            nextButton.onclick = nextQuestion;
            feedback.appendChild(nextButton);
        }

        function nextQuestion() {
            currentQuestionIndex++;

            if (currentQuestionIndex >= currentQuestions.length) {
                if (!isRetryMode && wrongQuestions.length > 0) {
                    startRetryMode();
                } else {
                    showResult();
                }
            } else {
                showQuestion();
            }
        }

        function startRetryMode() {
            isRetryMode = true;
            currentQuestions = wrongQuestions.slice();
            wrongQuestions = [];
            currentQuestionIndex = 0;
            alert('틀린 문제를 다시 풀어봅시다! 💪');
            showQuestion();
        }

        function showResult() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            var totalQuestions = 5;
            var score = Math.round((firstAttemptCorrect / totalQuestions) * 100);

            if (score === 100) {
                document.getElementById('resultTitle').textContent = '🎉 축하합니다! 100점을 달성했습니다!';
            } else {
                document.getElementById('resultTitle').textContent = '수고하셨습니다!';
            }

            document.getElementById('scoreDisplay').textContent = firstAttemptCorrect + ' / ' + totalQuestions + ' (' + score + '점)';

            var randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('motivationQuote').textContent = randomQuote;

            generateConcepts();
        }

        function generateConcepts() {
            var concepts = conceptBank[currentTextName];
            
            var conceptsBox = document.getElementById('conceptsToStudy');
            var html = '<h3>📌 보완하면 좋을 개념</h3><ul>';
            for (var i = 0; i < concepts.length; i++) {
                html += '<li>' + concepts[i] + '</li>';
            }
            html += '</ul>';
            conceptsBox.innerHTML = html;
        }

        function restart() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('textSelection').classList.add('hidden');
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('welcomeScreen').classList.remove('hidden');
            
            currentTextName = '';
            currentQuestions = [];
            currentQuestionIndex = 0;
            firstAttemptCorrect = 0;
            wrongQuestions = [];
            isRetryMode = false;
        }
    </script>
